<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="file.svg" />
		<script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<title>Genius8Loci — GitHub профиль</title>
		<style>
  @font-face {
    font-family: 'Cera Stencil Pro Trial';
    src: url('fonts/CeraStencilPro-Bold.woff2') format('woff2'),
         url('fonts/CeraStencilPro-Bold.woff') format('woff');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

    :root,
    [data-theme="dark"] {
    --bg: #000000;
    --panel: #0a0a0a;
    --border: #1f1f1f;
    --text: #e8e8e8;
    --muted: #949494;
    --accent: #58a6ff;
    --star-color: #FFF;
    }
    [data-theme="light"] {
    --bg: #ffffff;
    --panel: #f4f4f6;
    --border: #dcdce0;
    --text: #15161a;
    --muted: #5a5b60;
    --accent: #0969da;
    --star-color: #b0bfae;
    }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cera Stencil Pro Trial', 'Arial Black', Impact, sans-serif;
    font-weight: 700;
    position: relative;
    cursor: crosshair;
    overflow-x: hidden;
    touch-action: manipulation;
    transition: background .2s ease, color .2s ease;
  }

  /* ---------- Звёздное небо (самый задний фон) ---------- */
  #stars, #stars2, #stars3 {
  position: fixed;
  inset: 0;
  background: transparent;
  z-index: 0;
  pointer-events: none;
    }
    #stars { width: 1px; height: 1px; box-shadow: var(--stars-sm); animation: animStar 50s linear infinite; }
    #stars::after { content: ""; position: absolute; top: var(--star-field-h, 2000px); width: 1px; height: 1px; box-shadow: var(--stars-sm); }
    #stars2 { width: 2px; height: 2px; box-shadow: var(--stars-md); animation: animStar 100s linear infinite; }
    #stars2::after { content: ""; position: absolute; top: var(--star-field-h, 2000px); width: 2px; height: 2px; box-shadow: var(--stars-md); }
    #stars3 { width: 3px; height: 3px; box-shadow: var(--stars-lg); animation: animStar 150s linear infinite; }
    #stars3::after { content: ""; position: absolute; top: var(--star-field-h, 2000px); width: 3px; height: 3px; box-shadow: var(--stars-lg); }

    @keyframes animStar {
    from { transform: translateY(0px); }
    to   { transform: translateY(calc(-1 * var(--star-field-h, 2000px))); }
    }

  /* ---------- DVD-ник ---------- */
  #dvd-clone {
    position: fixed;
    top: 0; left: 0;
    z-index: 1;
    pointer-events: none;
    white-space: nowrap;
    will-change: left, top;
  }

  /* ---------- Переключатель темы ---------- */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 50;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s ease;
  }
  .theme-toggle:hover { transform: scale(1.08); }

  header { position: relative; z-index: 2; padding: 60px 24px 24px; text-align: center; }
  header h1 { margin: 0 0 8px; font-size: 32px; }
  header p { color: var(--muted); margin: 0; }
  header .hint { margin-top: 16px; font-size: 13px; color: var(--accent); }

  .donate { margin-top: 16px; }
  .donate a {
    display: inline-block;
    padding: 9px 20px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(88, 166, 255, 0.35);
    transition: transform .2s ease;
  }
  .donate a:hover { transform: translateY(-2px); }

  main { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; padding: 0 24px 200px; }
  main h2 { text-align: center; }

  .repos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; }
  .repo-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: default; }
  .repo-card a { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 15px; }
  .repo-card a:hover { text-decoration: underline; }
  .repo-card p { color: var(--muted); font-size: 13px; margin: 8px 0 0; min-height: 32px; }
  .repo-meta { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; }

  .note {
    position: absolute;
    max-width: min(220px, 60vw);
    color: #1a1a1a;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.35;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transform: rotate(var(--rot, -2deg));
    word-break: break-word;
    pointer-events: none;
    z-index: 5;
  }

  .note-form {
    position: absolute;
    z-index: 10;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    cursor: default;
    max-width: 90vw;
  }
  .note-form textarea {
    width: 220px;
    max-width: 70vw;
    height: 60px;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    font-family: inherit;
    font-size: 13px;
  }
  .note-form .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .note-form .counter { font-size: 11px; color: var(--muted); }
  .note-form button {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 12px;
  }
  .note-form button:disabled { opacity: 0.5; cursor: not-allowed; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 100;
    display: none;
  }

  @media (max-width: 640px) {
    header { padding: 44px 16px 16px; }
    header h1 { font-size: 24px; }
    .repos { grid-template-columns: 1fr; }
    .theme-toggle { top: 10px; right: 10px; width: 36px; height: 36px; font-size: 16px; }
  }
</style>
	</head>
	<body>
		<div id="stars"></div>
		<div id="stars2"></div>
		<div id="stars3"></div>
		<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Переключить тему оформления">🌙</button>
		<header>
			<h1>
				<span id="nickname">Genius8Loci</span>
			</h1>
			<p>Генератор светлых и не очень идей</p>
			<p class="donate">
				<a href="https://dalink.to/genius8loci" target="_blank" rel="noopener noreferrer">💜 Поддержать автора</a>
			</p>
			<p class="hint">Дважды кликните в любом месте страницы, чтобы оставить сообщение — оно останется здесь навсегда</p>
		</header>
		<main>
			<h2>Репозитории</h2>
			<div class="repos" id="repos">Загрузка репозиториев…</div>
		</main>
		<div class="toast" id="toast"></div>
		<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, push, update, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

// ==================== НАСТРОЙКИ ====================
const GITHUB_USERNAME = "genius8loci";

const firebaseConfig = {
  apiKey: "AIzaSyB1v95LCjlcNStz1SXrMMY6ywtoPa53_fI",
  authDomain: "genius8loci-github-io.firebaseapp.com",
  databaseURL: "https://genius8loci-github-io-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "genius8loci-github-io",
  storageBucket: "genius8loci-github-io.firebasestorage.app",
  messagingSenderId: "529560479338",
  appId: "1:529560479338:web:2d1a265fe72c37396d0c13"
};
// =====================================================

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const MAX_LENGTH = 100;
const URL_REGEX = /(https?:\/\/|www\.)/i;

let currentUid = null;
let currentIp = null;
signInAnonymously(auth).catch((e) => console.error("Auth error:", e));
onAuthStateChanged(auth, (user) => {
  currentUid = user ? user.uid : null;
});

fetch("https://api.ipify.org?format=json")
  .then((r) => r.json())
  .then((data) => {
    currentIp = (data.ip || "unknown").replace(/[.:]/g, "_");
  })
  .catch(() => {
    currentIp = "unknown";
  });

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => (t.style.display = "none"), 3000);
}

// ---------- Тема оформления ----------
const themeToggleBtn = document.getElementById("theme-toggle");
function reflectToggleIcon() {
  themeToggleBtn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "🌙" : "☀️";
}
reflectToggleIcon();
themeToggleBtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
  reflectToggleIcon();
});
try {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
    let stored = null;
    try { stored = localStorage.getItem("theme"); } catch (_) {}
    if (!stored) {
      document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
      reflectToggleIcon();
    }
  });
} catch (e) {}

// ---------- Звёздное небо ----------
function multipleBoxShadow(n, maxW, maxH) {
  const parts = [];
  for (let i = 0; i < n; i++) {
    parts.push(`${Math.floor(Math.random() * maxW)}px ${Math.floor(Math.random() * maxH)}px var(--star-color)`);
  }
  return parts.join(",");
}
(function initStars() {
  const fieldW = Math.max(window.innerWidth, document.documentElement.scrollWidth);
  const fieldH = window.innerHeight;
  const small = window.innerWidth < 640;
  document.documentElement.style.setProperty("--star-field-h", fieldH + "px");
  document.documentElement.style.setProperty("--stars-sm", multipleBoxShadow(small ? 350 : 700, fieldW, fieldH));
  document.documentElement.style.setProperty("--stars-md", multipleBoxShadow(small ? 100 : 200, fieldW, fieldH));
  document.documentElement.style.setProperty("--stars-lg", multipleBoxShadow(small ? 50 : 100, fieldW, fieldH));
})();

// ---------- DVD-ник ----------
(function setupDvdNickname() {
  const nickEl = document.getElementById("nickname");
  let active = false;

  function start() {
    if (active) return;
    active = true;

    const rect = nickEl.getBoundingClientRect();
    const cs = getComputedStyle(nickEl);

    const clone = document.createElement("div");
    clone.id = "dvd-clone";
    clone.textContent = nickEl.textContent;
    clone.style.fontSize = cs.fontSize;
    clone.style.fontWeight = cs.fontWeight;
    clone.style.fontFamily = cs.fontFamily;
    document.body.appendChild(clone);
    nickEl.style.visibility = "hidden";

    let x = rect.left;
    let y = rect.top;
    let dirX = 1;
    let dirY = 1;
    const speed = 2.5;
    let prevColor = "";

    function randomColor() {
      let c;
      do { c = `hsl(${Math.floor(Math.random() * 360)}, 90%, 60%)`; } while (c === prevColor);
      prevColor = c;
      return c;
    }
    clone.style.color = randomColor();

    function animate() {
      const w = clone.offsetWidth || 150;
      const h = clone.offsetHeight || 40;
      const maxX = window.innerWidth - w;
      const maxY = window.innerHeight - h;

      if (x <= 0 || x >= maxX) {
        dirX *= -1;
        x = Math.max(0, Math.min(x, maxX));
        clone.style.color = randomColor();
      }
      if (y <= 0 || y >= maxY) {
        dirY *= -1;
        y = Math.max(0, Math.min(y, maxY));
        clone.style.color = randomColor();
      }
      x += dirX * speed;
      y += dirY * speed;
      clone.style.left = x + "px";
      clone.style.top = y + "px";
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }

  nickEl.addEventListener("mouseenter", start);
})();

// ---------- Репозитории GitHub ----------
async function loadRepos() {
  const container = document.getElementById("repos");
  try {
    const res = await fetch(
      `https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=12`
    );
    if (!res.ok) throw new Error("GitHub API error");
    const repos = await res.json();

    container.innerHTML = "";
    repos.forEach((repo) => {
      const card = document.createElement("div");
      card.className = "repo-card";
      card.innerHTML = `
        
			
			<a href="${repo.html_url}" target="_blank" rel="noopener">${repo.name}</a>
			<p>${repo.description ? escapeHtml(repo.description) : "Без описания"}</p>
			<div class="repo-meta">
				<span>★ ${repo.stargazers_count}</span>
				<span>${repo.language || "—"}</span>
			</div>`;
      container.appendChild(card);
    });
  } catch (e) {
    container.innerHTML = "<p>Не удалось загрузить репозитории.</p>";
    console.error(e);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Заметки ----------
function renderNote(id, note) {
  if (document.getElementById(`note-${id}`)) return;
  const el = document.createElement("div");
  el.className = "note";
  el.id = `note-${id}`;
  el.style.left = note.x + "%";
  el.style.top = note.y + "%";
  el.style.setProperty("--rot", (Math.random() * 6 - 3).toFixed(1) + "deg");
  const hue = Math.floor(Math.random() * 360);
  el.style.background = `hsl(${hue}, 85%, 80%)`;
  el.textContent = note.text;
  document.body.appendChild(el);
}

onChildAdded(ref(db, "notes"), (snapshot) => {
  renderNote(snapshot.key, snapshot.val());
});

// ---------- Форма добавления заметки ----------
let activeForm = null;

function openNoteForm(pageX, pageY, targetEl) {
  if (targetEl && (targetEl.closest(".repo-card") || targetEl.closest(".note-form") || targetEl.closest(".theme-toggle"))) return;
  if (activeForm) activeForm.remove();

  const xPct = (pageX / document.documentElement.scrollWidth) * 100;
  const yPct = (pageY / document.documentElement.scrollHeight) * 100;

  const form = document.createElement("div");
  form.className = "note-form";
  form.style.left = Math.min(xPct, 70) + "%";
  form.style.top = yPct + "%";
  form.innerHTML = `
    <textarea maxlength="${MAX_LENGTH}" placeholder="Ваше сообщение…"></textarea>
    <div class="row">
      <span class="counter">0/${MAX_LENGTH}</span>
      <button type="button">Оставить</button>
    </div>`;

  document.body.appendChild(form);
  activeForm = form;

  const textarea = form.querySelector("textarea");
  const counter = form.querySelector(".counter");
  const button = form.querySelector("button");

  textarea.focus();
  textarea.addEventListener("input", () => {
    counter.textContent = `${textarea.value.length}/${MAX_LENGTH}`;
  });

  button.addEventListener("click", async () => {
    const text = textarea.value.trim();
    if (!text) return;
    if (text.length > MAX_LENGTH) {
      showToast(`Максимум ${MAX_LENGTH} символов`);
      return;
    }
    if (URL_REGEX.test(text)) {
      showToast("Ссылки запрещены");
      return;
    }
    if (!currentUid) {
      showToast("Подождите, идёт авторизация…");
      return;
    }
    if (!currentIp) {
      showToast("Подождите, определяется IP…");
      return;
    }

    button.disabled = true;
    button.textContent = "Отправка…";

    try {
      const noteRef = push(ref(db, "notes"));
      const updates = {};
      updates[`notes/${noteRef.key}`] = { x: xPct, y: yPct, text, ts: serverTimestamp(), ip: currentIp };
      updates[`used_uids/${currentUid}`] = true;
      updates[`used_ips/${currentIp}`] = true;
      updates["meta/last_ts"] = serverTimestamp();
      await update(ref(db), updates);
      showToast("Сообщение сохранено");
    } catch (err) {
      let msg = err.message || "Не удалось сохранить сообщение";
      if (err.code === "PERMISSION_DENIED") {
        msg = "Нельзя: либо вы уже писали (браузер/IP), либо кто-то оставил запись меньше минуты назад";
      }
      showToast(msg);
    } finally {
      form.remove();
      activeForm = null;
    }
  });

  document.addEventListener(
    "click",
    (ev) => {
      if (form.contains(ev.target)) return;
      form.remove();
      if (activeForm === form) activeForm = null;
    },
    { once: true, capture: true }
  );
  document.addEventListener(
    "touchend",
    (ev) => {
      if (form.contains(ev.target)) return;
      form.remove();
      if (activeForm === form) activeForm = null;
    },
    { once: true, capture: true }
  );
}

document.addEventListener("dblclick", (e) => {
  openNoteForm(e.pageX, e.pageY, e.target);
});

// Резервное определение двойного тапа — на случай, если touch-action:manipulation
// не даёт браузеру сгенерировать dblclick (старые версии некоторых мобильных браузеров)
let lastTapTime = 0;
let lastTapX = 0;
let lastTapY = 0;
const DOUBLE_TAP_MS = 400;
const DOUBLE_TAP_DIST = 40;

document.addEventListener(
  "touchend",
  (e) => {
    if (e.target.closest(".note-form") || e.target.closest(".theme-toggle")) return;
    const touch = e.changedTouches[0];
    if (!touch) return;

    const now = Date.now();
    const dx = Math.abs(touch.pageX - lastTapX);
    const dy = Math.abs(touch.pageY - lastTapY);

    if (now - lastTapTime < DOUBLE_TAP_MS && dx < DOUBLE_TAP_DIST && dy < DOUBLE_TAP_DIST) {
      e.preventDefault();
      lastTapTime = 0;
      openNoteForm(touch.pageX, touch.pageY, e.target);
    } else {
      lastTapTime = now;
      lastTapX = touch.pageX;
      lastTapY = touch.pageY;
    }
  },
  { passive: false }
);

loadRepos();

		
		</script>
	</body>
</html>
