<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Genius8Loci — репозитории GitHub и стена сообщений."
    />
    <title>Genius8Loci — GitHub профиль</title>

    <link rel="icon" type="image/svg+xml" href="file.svg" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin="anonymous" />

    <!-- Тема применяется до отрисовки, поэтому скрипт блокирующий -->
    <script src="theme.js"></script>
  </head>

  <body>
    <div id="stars" aria-hidden="true"></div>
    <div id="stars2" aria-hidden="true"></div>
    <div id="stars3" aria-hidden="true"></div>

    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Переключить тему оформления"
    >
      🌙
    </button>

    <header>
      <h1><span id="nickname">Genius8Loci</span></h1>
      <p>Генератор светлых и не очень идей</p>
      <p class="donate">
        <a
          href="https://dalink.to/genius8loci"
          target="_blank"
          rel="noopener noreferrer"
          >💜 Поддержать автора</a
        >
      </p>
      <p class="hint">
        Дважды кликните в любом месте страницы, чтобы оставить сообщение — оно
        останется здесь навсегда
      </p>
    </header>

    <main>
      <h2>Репозитории</h2>
      <div class="repos" id="repos">Загрузка репозиториев…</div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
